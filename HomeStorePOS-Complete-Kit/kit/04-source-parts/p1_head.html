<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeStore POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* palette: deep teal #356C68 · soft sage #A9C8B4 · fresh mint #78D6B0 · warm ivory #F8F7F3 · charcoal #273238 */
  --bg:#F8F7F3; --bg2:#EEF2EE; --surface:#FFFFFF; --ink:#273238; --ink2:#4E5C62; --line:#D6E1DA; --line2:#E8EEEA;
  --mint:#78D6B0; --mint2:#DFF3EA; --mint3:#2E8C6C; --sage:#A9C8B4; --sage2:#E3EEE7; --teal:#356C68; --teal2:#2C5B58; --amber:#B98A2B; --amber2:#F7EDD5; --red:#B9564A; --red2:#F6E0DC; --blue:#4A7FA5; --blue2:#E0EAF2;
  --shadow:0 1px 2px rgba(39,50,56,.05), 0 8px 24px -12px rgba(39,50,56,.16);
  --r:12px; --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1A2225; --bg2:#222C30; --surface:#263135; --ink:#F0F1EC; --ink2:#A7B4B2; --line:#3B4A4F; --line2:#31404476; --mint2:#27473C; --sage2:#2C3D3A; --amber2:#4A3C1C; --red2:#4B2A26; --blue2:#22364A; --teal:#2B5754; --teal2:#234845;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#1A2225; --bg2:#222C30; --surface:#263135; --ink:#F0F1EC; --ink2:#A7B4B2; --line:#3B4A4F; --line2:#31404476; --mint2:#27473C; --sage2:#2C3D3A; --amber2:#4A3C1C; --red2:#4B2A26; --blue2:#22364A; --teal:#2B5754; --teal2:#234845;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--mint3);text-decoration:none;font-weight:600} a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:17px} h3{font-size:14.5px}
p{margin:0 0 10px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
nav{background:var(--teal);color:#EAF1EC;padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:800;font-size:16px;letter-spacing:-.02em;color:#fff;line-height:1.2}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--mint);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:14px;font-weight:800;letter-spacing:.02em;flex:none;overflow:hidden}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand .logo.admin{background:var(--sage);color:var(--ink)}
.usercard{display:flex;align-items:center;gap:10px;padding:10px 8px;border-top:1px solid rgba(255,255,255,.1);margin-top:6px}
.usercard .avatar{background:rgba(255,255,255,.14);color:#fff}
.usercard .who{flex:1;min-width:0;line-height:1.25} .usercard .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .usercard .who span{font-size:12px;opacity:.7;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usercard button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;flex:none} .usercard button:hover{background:rgba(255,255,255,.2)}
.pagedate{color:var(--ink2);font-size:13px;margin:-8px 0 14px}
.brand small{display:block;font-weight:500;font-size:11.5px;opacity:.65;margin-top:2px}
nav .sec{font-size:11px;letter-spacing:.06em;opacity:.55;padding:12px 12px 4px;font-weight:700}
nav button{background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;width:100%}
nav button svg{width:18px;height:18px;flex:none;opacity:.8}
nav button span.lbl{flex:1}
nav button:hover{background:rgba(255,255,255,.07)}
nav button.on{background:var(--mint);color:var(--ink)} nav button.on svg{opacity:1}
nav button .tag{background:rgba(255,255,255,.18);color:#fff} nav button.on .tag{background:var(--ink);color:#fff}
nav .spacer{flex:1}
nav .status{font-size:12px;opacity:.75;padding:4px 12px 2px;line-height:1.4}
nav .status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:6px}
main{padding:0 0 80px;max-width:1400px;width:100%;min-width:0}
.content{padding:24px 28px 0}
.appbar{display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.appbar .crumb{color:var(--ink2);font-size:13px;white-space:nowrap} .appbar .crumb b{color:var(--ink)}
.appbar .sp{flex:1}
.appbar .user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--mint2);color:var(--mint3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.topbar h1{flex:1;min-width:140px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{border-color:var(--mint);background:var(--mint2)}
.btn.p{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.btn.p:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.s{padding:5px 10px;font-size:13px}
.btn.d{color:var(--red)} .btn.d:hover{background:var(--red2);border-color:var(--red)}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.stat{padding:16px 18px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mint)}
.stat.a::before{background:var(--amber)} .stat.r::before{background:var(--red)} .stat.t::before{background:var(--teal)} .stat.b::before{background:var(--sage)}
.stat.plain::before{display:none}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat .l{color:var(--ink2);font-size:13px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--ink2);font-weight:700;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--sage2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover td{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=password],input[type=url],input[type=search],select,textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);transition:border-color .12s,box-shadow .12s;min-width:0}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--mint);box-shadow:0 0 0 3px var(--mint2)}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
label.f{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:4px}
.field{margin-bottom:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.row>.fx{flex:0 0 auto}
.bgroup{display:flex;gap:4px;align-items:center;flex:0 0 auto}
.muted{color:var(--ink2);font-size:13px}
.small{font-size:12.5px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sage2);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--mint2);color:var(--mint3)} .tag.warn{background:var(--amber2);color:var(--amber)} .tag.bad{background:var(--red2);color:var(--red)} .tag.info{background:var(--blue2);color:var(--blue)}
.modal-bg{position:fixed;inset:0;background:rgba(6,25,22,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:16px;padding:22px;width:min(760px,100%);max-height:94vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal.wide{width:min(980px,100%)}
.modal h2{margin-bottom:12px;font-size:19px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line2);flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:99;box-shadow:var(--shadow);max-width:92vw;text-align:center}
.toast.err{background:var(--red)}
.syncpill{font-size:12px;color:var(--ink2);white-space:nowrap} .syncpill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:5px} .syncpill.busy .dot{background:var(--amber);animation:pulse 1s infinite} .syncpill.off .dot{background:var(--ink2)}
@keyframes pulse{50%{opacity:.3}}
.msg{min-height:20px;font-size:13px;font-weight:600;color:var(--red);margin:6px 0}
.msg.ok{color:var(--mint3)}
.empty{padding:30px;text-align:center;color:var(--ink2)}
.sub{display:flex;flex-wrap:wrap;gap:4px;background:var(--sage2);padding:4px;border-radius:10px;margin-bottom:16px;width:max-content;max-width:100%;align-items:center}
.sub button{background:none;border:0;padding:7px 14px;cursor:pointer;color:var(--ink2);font-weight:700;border-radius:8px;white-space:nowrap}
.sub button.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:160px}
.dd{position:relative;display:inline-block}
.dd summary{list-style:none;cursor:pointer} .dd summary::-webkit-details-marker{display:none}
.dd .dd-menu{position:absolute;left:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:210px;z-index:30;padding:6px}
.dd .dd-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:7px;cursor:pointer;font-weight:600;white-space:nowrap}
.topbar .dd .dd-menu,.toolbar .dd:last-of-type .dd-menu{left:auto;right:0}
.actions .dd .dd-menu{top:auto;bottom:calc(100% + 6px);left:auto;right:0}
.dd .dd-menu button:hover{background:var(--mint2)} .dd .dd-menu button.d{color:var(--red)} .dd .dd-menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
.attn{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)} .attn:last-child{border-bottom:0}
.attn .n{width:34px;height:34px;border-radius:10px;background:var(--mint2);color:var(--mint3);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.attn .n.warn{background:var(--amber2);color:var(--amber)} .attn .n.bad{background:var(--red2);color:var(--red)}
.attn .t{flex:1;min-width:0} .attn .t b{display:block} .attn .t span{color:var(--ink2);font-size:13px}
.ltog{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;cursor:pointer;color:var(--ink2);background:var(--surface);margin-left:4px;user-select:none} .ltog.on{background:var(--amber2);border-color:var(--amber);color:var(--amber)} .ltog.on.asis{background:var(--red2);border-color:var(--red);color:var(--red)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip:hover,.chip.on{background:var(--mint2);border-color:var(--mint);color:var(--mint3)}
.inv{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px}
.inv .side{font-size:15px} .inv .side .tot{font-size:15.5px;padding:7px 0} .inv .side .tot .muted{font-size:14px;color:var(--ink2)} .inv .side select,.inv .side input{font-size:15px} .inv .side .app.training nav{box-shadow:inset -6px 0 0 #7A3E9D}
.notice{font-size:14px;line-height:1.45;font-weight:500;color:var(--ink)} .inv .side .notice b{font-weight:700} .inv .side .small{font-size:13px} .inv .side .f{font-size:13px} .inv .side .total-line{font-size:24px} .inv .side .chip{font-size:14px;padding:7px 12px}
@media (max-width:1150px){.inv{grid-template-columns:minmax(0,1fr) 330px}}
@media (max-width:1000px){.inv{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:22px minmax(0,1fr) 58px 88px 90px 30px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.line .meta{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;font-size:12.5px}
.line.in-group{padding-left:18px;border-left:3px solid var(--mint);margin-left:4px}
.line input[type=number]{padding:5px 7px}
.grp{display:flex;justify-content:space-between;align-items:center;background:var(--sage2);padding:9px 12px;border-radius:9px 9px 0 0;margin-top:12px;font-weight:700;flex-wrap:wrap;gap:8px}
.margin-box{background:var(--teal);color:#E6F0EB;border-radius:12px;padding:14px;margin-top:12px;font-size:13px}
.margin-box .big{font-size:24px;font-weight:800;color:#fff}
.margin-box .low{color:#FFB2A3}
.margin-box .r{display:flex;justify-content:space-between;padding:2px 0}
.side .sec{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.side .sec:first-child{margin-top:0;padding-top:0;border-top:0}
.side .sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px}
.side .sec h4 .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--sage2);color:var(--ink);font-size:11px;align-items:center;justify-content:center;font-weight:800}
.side .fulfil{width:100%;padding:8px 10px;font-size:15px}
.side .taxrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
.side .taxrow select{width:auto;max-width:55%;padding:4px 8px;font-size:13px}
.pays{margin:8px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pays .p{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
.pays .p:first-child{border-top:0}
.pays .p .m{flex:1;font-weight:600}
.pays .p .x{color:var(--ink2);text-decoration:none;font-size:16px;line-height:1;padding:0 4px}
.pays .bal{display:flex;justify-content:space-between;padding:10px;background:var(--sage2);font-weight:800;font-size:15px}
.pays .bal.zero{background:var(--mint2);color:var(--green)}
.pays .bal.due{background:#FFF3E0;color:#8a4b00}
nav button .tag.ok{background:var(--green);color:#fff;border-color:var(--green)}
.signwrap{max-width:640px;margin:0 auto;padding:14px 12px 40px;font-size:16px;line-height:1.45}
.signwrap .sg-step{background:var(--surface);border-radius:16px;padding:18px;margin:0 0 14px;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);border:1px solid var(--line)}
.signwrap .sg-head{text-align:center}
.signwrap .sg-total{font-size:30px;font-weight:900;margin:6px 0 2px}
.signwrap h3{margin:0 0 12px;font-size:19px;display:flex;align-items:center;gap:10px}
.signwrap .sg-n{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
.signwrap .sg-terms{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.signwrap .sg-term{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.signwrap .sg-term input{width:84px;flex:none;text-align:center;text-transform:uppercase;font-size:16px;min-height:44px}
.signwrap .sg-agree{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;font-weight:700}
.signwrap .sg-agree input{width:24px;height:24px;flex:none;margin-top:2px}
.signwrap .sg-sub{margin:0 0 16px;padding:0 0 14px;border-bottom:1px solid var(--line)}
.signwrap .sg-sub:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.signwrap .sg-req{color:var(--red);font-weight:700;font-size:13px}
.signwrap .sg-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.signwrap .sg-photo{display:block;border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;font-weight:700;cursor:pointer;margin-top:8px;background:var(--sage2)}
.signwrap .sg-prev img{max-height:110px;border-radius:8px;margin-top:8px;border:1px solid var(--line)}
.signwrap input[type=text],.signwrap input[type=number]{font-size:16px;min-height:48px}
.signwrap .sig{height:260px}
.signwrap .sg-big{min-height:56px;font-size:18px}
.signwrap .ptable th,.signwrap .ptable td{font-size:14px}
.signwrap .ptable{table-layout:fixed;width:100%} .signwrap .ptable td{word-wrap:break-word}
.hot{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06);transition:border-color .15s,box-shadow .15s}
.hot:hover{border-color:var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.topbar h1.hot{flex:0 0 auto;margin-right:auto}
.hot .hint{font-size:11px;font-weight:600;color:var(--ink2);background:var(--sage2);border-radius:999px;padding:2px 8px;letter-spacing:.02em}
.tot{display:flex;justify-content:space-between;align-items:center;padding:5px 0;gap:8px}
.tot.grand{font-size:22px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.search-res{position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;z-index:20;box-shadow:var(--shadow)}
.search-res div{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line2)}
.search-res div:hover,.search-res div.hl{background:var(--mint2)}
.rel{position:relative}
.suggest{background:var(--sage2);border-radius:10px;padding:10px 12px;margin-top:10px}
.map{width:100%;aspect-ratio:1.5;background:var(--bg2);border-radius:10px;border:1px solid var(--line);margin-bottom:6px}
.stop{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.stop .num{width:26px;height:26px;border-radius:50%;background:var(--mint);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-top:2px}
.stop .num.late{background:var(--red);color:#fff} .stop .num.done{background:var(--teal);color:#fff}
.truckhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-weight:600} .chk input{width:auto;accent-color:var(--mint)}
